<body>
<div id="leaves" aria-hidden="true"><i style="left:5%;--s:24px;--t:28s;--d:-6s"></i><i style="left:20%;--s:18px;--t:34s;--d:-20s"></i><i style="left:38%;--s:28px;--t:30s;--d:-12s"></i><i style="left:57%;--s:20px;--t:36s;--d:-27s"></i><i style="left:74%;--s:26px;--t:27s;--d:-2s"></i><i style="left:90%;--s:18px;--t:32s;--d:-16s"></i></div>
<header><div><h1>🌿 สมุดบันทึกโรงบดกระจก</h1><p>TLH AUTO GLASS แต้ล้งฮั้ว 95 กรุ๊ป จำกัด · เก็บข้อมูลเพื่อคำนวณค่า CFP</p></div></header>
<nav role="tablist">
<button role="tab" id="t1" aria-selected="true">บันทึกรายวัน</button>
<button role="tab" id="t2" aria-selected="false">ประวัติและสรุปรายเดือน</button>
<button role="tab" id="t3" aria-selected="false">คำนวณ CFP</button>
</nav>
<main><div class="panel" id="app"></div></main>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<script>
const STEPS=["เตรียมกระจก","นำกระจกแช่น้ำ (10–12 ชม.)","ลอกฟิล์มออก","นำแป้นกระจกออก / ตัดขอบเซรามิก","เข้าเครื่องบดหยาบ","เข้าเครื่องปั่นแยกกระจก / PVB","เข้าเครื่องร่อนแยกขนาด","บรรจุถุงละ 1,000 กก. รอนำส่ง"];
const HINT=["จำนวนพาเลท","","น้ำหนักฟิล์มที่ลอกได้","น้ำหนักก่อน/หลังตัดขอบ","น้ำหนักเข้าเครื่อง","น้ำหนักกระจกสะอาด / ติด PVB","น้ำหนักแยกตามตะแกรง","จำนวนถุง · น้ำหนักรวม"];
const KEY="tlh-glass-log-v1";
let S={days:{},months:{},tol:3};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
Object.values(S.days).forEach(d=>d.batches.forEach(b=>{if(b.waste!==undefined){if(b.pvb==null)b.pvb=b.waste;delete b.waste}}));
let _t;const flush=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};const save=()=>{clearTimeout(_t);_t=setTimeout(flush,250)};addEventListener("pagehide",flush);addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
let cur=ymd(new Date()),tab=1,ym=cur.slice(0,7);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const day=()=>S.days[cur]||(S.days[cur]={type:"",rec:"",rev:"",signed:false,batches:[]});
const newStep=()=>({sd:"",st:"",ed:"",et:"",wi:"",wo:"",op:"",nt:""});
const dur=s=>{if(!s.sd||!s.st||!s.ed||!s.et)return null;const m=(new Date(s.ed+"T"+s.et)-new Date(s.sd+"T"+s.st))/6e4;return m>=0?m:null};
const fmt=m=>m==null?"–":Math.floor(m/60)+":"+pad(Math.round(m%60));
const kg=n=>n.toLocaleString("th-TH",{maximumFractionDigits:1});
const nowParts=()=>{const d=new Date();return[ymd(d),pad(d.getHours())+":"+pad(d.getMinutes())]};

function balance(b){
 const pre=num(b.pre),film=num(b.st[2].wo),waste=num(b.pvb)+num(b.cer),fin=num(b.st[7].wo);
 if(!pre||!fin)return null;
 const diff=pre-film-waste-fin,pct=diff/pre*100;
 return{diff,pct,bad:Math.abs(pct)>S.tol};
}
function render(){
 $t1.setAttribute("aria-selected",tab==1);$t2.setAttribute("aria-selected",tab==2);$t3.setAttribute("aria-selected",tab==3);
 $app.innerHTML=tab==1?viewDay():tab==2?viewMonth():viewCfp();if(tab==3)cfpCalc();if(tab==1)day().batches.forEach((b,i)=>b.st.forEach((s,j)=>{if(s.ph&&s.ph.length)renderPh(i,j)}));
 if(tab==1)calc();
}
function viewDay(){
 const d=day(),L=d.signed?"disabled":"";
 const b=d.batches;
 return `<ul class="flow" id="flow"></ul>
 <div class="row">
  <label>วันที่<input type="date" id="date" value="${cur}"></label>
  <label>ชนิดกระจก<select data-d="type" ${L}><option value="">เลือก</option><option ${d.type=="LAMINATE"?"selected":""}>LAMINATE</option><option ${d.type=="TEMPERED"?"selected":""}>TEMPERED</option></select></label>
  <label>ผู้บันทึก<input data-d="rec" value="${esc(d.rec)}" ${L}></label>
  <label>จำนวนล็อต (Batch) วันนี้<input value="${b.length}" disabled></label>
 </div>
 ${b.map((x,i)=>viewBatch(x,i,L)).join("")}
 <div class="bar"><button class="btn" id="addB" ${L}>เปิดล็อต (Batch) ใหม่</button></div>
 <h2>สรุปประจำวัน</h2><div class="tw" id="sum"></div>
 <div class="sign">
  <label>ผู้บันทึก (ลงนาม)<input data-d="rec" value="${esc(d.rec)}" ${L}></label>
  <label>ผู้ตรวจสอบ (ลงนาม)<input data-d="rev" value="${esc(d.rev)}" ${L}></label>
 </div>
 <div id="msg"></div>${d.signed?"":'<button class="btn fab" data-add>+ เปิดล็อตใหม่</button>'}
 <div class="bar">
  <button class="btn" id="sign">${d.signed?"ปลดล็อกเพื่อแก้ไข":"ลงนามรับรองและปิดวัน"}</button>
  <button class="btn alt" onclick="print()">พิมพ์แบบฟอร์ม</button>
 </div>
 <div class="bar end">
  <button class="btn" id="savedoc">บันทึกเป็นเอกสาร (Word)</button>
 </div>`;
}
function viewBatch(x,i,L){
 return `<section class="batch${x.col?" col":""}"><div class="bh">
  <div><label>ล็อตที่ ${i+1} · รหัส / จำนวนพาเลท<input data-b="${i}" data-k="code" value="${esc(x.code)}" ${L}></label></div>
  <div><label>น้ำหนักกระจกรวมก่อนแช่ (kg)<input type="number" inputmode="decimal" min="0" data-b="${i}" data-k="pre" value="${esc(x.pre)}" ${L}></label></div>
  <div><label>น้ำหนัก PVB (kg)<input type="number" inputmode="decimal" min="0" data-b="${i}" data-k="pvb" value="${esc(x.pvb)}" ${L}></label></div>
  <div><label>น้ำหนักขอบเซรามิก (kg)<input type="number" inputmode="decimal" min="0" data-b="${i}" data-k="cer" value="${esc(x.cer)}" ${L}></label></div>

 const ch=[new Paragraph({heading:HeadingLevel.HEADING_1,children:[new TextRun("บันทึกข้อมูลกระบวนการผลิตรายวัน โรงบดกระจก")]}),P("TLH AUTO GLASS แต้ล้งฮั้ว 95 กรุ๊ป จำกัด · ข้อมูลสำหรับคำนวณค่าคาร์บอนฟุตพริ้นท์ (CFP)",{r:{color:"555555"}}),
  T(["วันที่","ชนิดกระจก","ผู้บันทึก","ผู้ตรวจสอบ","จำนวนล็อต","สถานะ"],[[cur,d.type,d.rec,d.rev,d.batches.length,d.signed?"ลงนามแล้ว":"ยังไม่ปิดวัน"]],[16,16,20,20,14,14])];
 for(const [i,b] of d.batches.entries()){
  const r=balance(b);
  ch.push(new Paragraph({heading:HeadingLevel.HEADING_2,spacing:{before:240},children:[new TextRun("ล็อตที่ "+(i+1)+(b.code?" · "+b.code:""))]}),
   P("น้ำหนักก่อนแช่ "+(b.pre||"-")+" kg · PVB "+(b.pvb||"-")+" kg · ขอบเซรามิก "+(b.cer||"-")+" kg"),
   P(r?"สมดุลน้ำหนัก: ส่วนต่าง "+kg(r.diff)+" kg ("+r.pct.toFixed(1)+"%) · "+(r.bad?"ไม่ตรง"+(b.chk?" (ตรวจซ้ำ/แก้ไขแล้ว)":""):"ตรง"):"สมดุลน้ำหนัก: ข้อมูลยังไม่ครบ"),
   T(["ขั้นตอน","เริ่ม","จบ","ใช้เวลา","เข้า (kg)","ออก (kg)","ผู้ปฏิบัติ","หมายเหตุ"],b.st.map((s,j)=>[(j+1)+". "+STEPS[j],(s.sd+" "+s.st).trim(),(s.ed+" "+s.et).trim(),fmt(dur(s)),s.wi,s.wo,s.op,s.nt]),[24,13,13,8,8,8,12,14]));
  for(const [j,s] of b.st.entries()){const ph=s.ph||[];if(!ph.length)continue;
   ch.push(P("รูปหลักฐาน ขั้นตอนที่ "+(j+1)+" "+STEPS[j],{r:{bold:true}}));
   const runs=[];for(const id of ph){const u=await getPh(id),o=u&&await imgData(u);if(o){const w=240;runs.push(new ImageRun({data:o.a,type:"jpg",transformation:{width:w,height:Math.round(w*o.h/o.w)}}),new TextRun("   "))}}
   if(runs.length)ch.push(new Paragraph({children:runs}));}
 }
 ch.push(new Paragraph({heading:HeadingLevel.HEADING_2,spacing:{before:240},children:[new TextRun("สรุปประจำวัน")]}),
  T(["ขั้นตอน","จำนวนล็อตที่ทำ","เวลารวม (ชม:นาที)","เวลาเฉลี่ยต่อล็อต"],STEPS.map((n,j)=>{let c=0,tt=0;d.batches.forEach(x=>{const mm=dur(x.st[j]);if(mm!=null){c++;tt+=mm}});return[(j+1)+". "+n,c,fmt(c?tt:null),fmt(c?tt/c:null)]}),[40,20,20,20]),
  P(""),P("ลงชื่อผู้บันทึก ........................................   ("+(d.rec||"................")+")"),P("ลงชื่อผู้ตรวจสอบ ......................................   ("+(d.rev||"................")+")"));
 const doc=new Document({styles:{default:{document:{run:{font:"Tahoma",size:21}}}},sections:[{properties:{page:{size:{orientation:PageOrientation.LANDSCAPE}}},children:ch}]});
 try{const blob=await Packer.toBlob(doc);await dl.save({filename:"tlh-glass-"+cur+".docx",data:blob})}catch(e){if(!e||e.code!="declined")err("บันทึกเอกสารไม่สำเร็จ ลองใหม่อีกครั้ง")}
}
function exportCsv(){
 const out=[["วันที่","ชนิดกระจก","ล็อต","รหัส/พาเลท","น้ำหนักก่อนแช่","น้ำหนัก PVB","น้ำหนักขอบเซรามิก","ขั้นตอน","วันที่เริ่ม","เวลาเริ่ม","วันที่จบ","เวลาจบ","นาที","น้ำหนักเข้า","น้ำหนักออก","ผู้ปฏิบัติ","หมายเหตุ"]];
 Object.keys(S.days).filter(k=>k.startsWith(ym)).sort().forEach(k=>{const d=S.days[k];d.batches.forEach((b,i)=>b.st.forEach((s,j)=>out.push([k,d.type,i+1,b.code,b.pre,b.pvb,b.cer,STEPS[j],s.sd,s.st,s.ed,s.et,dur(s)??"",s.wi,s.wo,s.op,s.nt])))});
 const t="\ufeff"+out.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
 claude.use("downloads").then(dl=>{if(!dl)return ask("เบราว์เซอร์นี้บันทึกไฟล์ไม่ได้ ลองเปิดบนคอมพิวเตอร์",()=>{});return dl.save({filename:"tlh-glass-"+ym+".csv",data:t})}).catch(()=>{});
}
const $=id=>document.getElementById(id),$app=$("app"),$t1=$("t1"),$t2=$("t2"),$t3=$("t3");
$t1.onclick=()=>{tab=1;render()};$t2.onclick=()=>{tab=2;render()};$t3.onclick=()=>{tab=3;render()};
const onPick=e=>{const f=[...e.target.files];e.target.value="";if(f.length&&tgt)addPhotos(f,tgt[0],tgt[1])};
$("camIn").onchange=onPick;$("fileIn").onchange=onPick;
$app.addEventListener("click",e=>{const im=e.target.closest("img[data-view]");if(!im)return;const o=document.createElement("div");o.className="ov";o.innerHTML=`<img src="${im.src}" alt="รูปหลักฐาน" style="max-width:100%;max-height:90vh;border-radius:10px">`;o.onclick=()=>o.remove();document.body.appendChild(o)});
$app.addEventListener("input",e=>{
 const t=e.target,D=t.dataset;
 if(t.id=="date"){if(t.value){cur=t.value;render()}return}
 if(t.id=="ym"){if(t.value){ym=t.value;render()}return}
 if(t.id=="tol"){S.tol=num(t.value);save();return}
 if(D.d){day()[D.d]=t.value;document.querySelectorAll(`[data-d="${D.d}"]`).forEach(x=>{if(x!==t)x.value=t.value})}
 else if(D.m)S.months[ym][D.m]=t.checked;
 else if(D.mv)S.months[ym][D.mv]=t.value;
 else if(D.b!==undefined){const b=day().batches[D.b],v=t.type=="checkbox"?t.checked:t.value;if(D.s!==undefined)b.st[D.s][D.k]=v;else b[D.k]=v}
 else if(D.cq!==undefined){S.cfp[ym].q[D.cq]=t.value}else if(D.ce!==undefined){S.cfp[ym].e[D.ce]=t.value}else if(D.cn!==undefined){S.cfp[ym].note=t.value}else return;
 save();if(tab==1)calc();if(tab==3)cfpCalc();
});
$app.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;const D=t.dataset,d=day();
 if(t.id=="addB"||D.add!==undefined){d.batches.forEach(x=>x.col=true);d.batches.push({code:"",pre:"",pvb:"",cer:"",chk:false,col:false,st:STEPS.map(newStep)});save();render();const el=document.querySelectorAll(".batch"),nb=el[el.length-1];nb.classList.add("new");nb.scrollIntoView({behavior:"smooth",block:"start"});nb.querySelector("input").focus({preventScroll:true})}
 else if(D.rst!==undefined){const s=d.batches[D.b].st[D.s];["sd","st","ed","et"].forEach(k=>{s[k]="";const el=document.querySelector(`[data-b="${D.b}"][data-s="${D.s}"][data-k="${k}"]`);if(el)el.value=""});save();calc()}
 else if(D.rstb!==undefined){const i=+D.rstb;ask("รีเซ็ทเวลาทุกขั้นตอนของล็อตที่ "+(i+1)+" ใช่หรือไม่? (น้ำหนักจะไม่ถูกลบ)",()=>{d.batches[i].st.forEach(s=>{s.sd=s.st=s.ed=s.et=""});save();render()})}
 else if(t.id=="savedoc"){saveDoc()}
 else if(D.cam!==undefined){tgt=[+D.b,+D.s];$("camIn").click()}
 else if(D.att!==undefined){tgt=[+D.b,+D.s];$("fileIn").click()}
 else if(D.pd!==undefined){const bi=+D.b,si=+D.s,id=D.pd;ask("ลบรูปนี้ใช่หรือไม่?",()=>{const s=d.batches[bi].st[si];s.ph=s.ph.filter(x=>x!==id);idb("del",id).catch(()=>{});delete PC[id];save();renderPh(bi,si)})}
 else if(D.rsta!==undefined){const i=+D.rsta;ask("ท่านแน่ใจจะจบรายการนี้ใช่ไหม? ข้อมูลที่กรอกในล็อตที่ "+(i+1)+" จะถูกล้างทั้งหมด",()=>{d.batches[i]={code:"",pre:"",pvb:"",cer:"",chk:false,col:false,st:STEPS.map(newStep)};save();render()})}
 else if(D.tog!==undefined){const x=d.batches[D.tog],sec=t.closest(".batch");x.col=!x.col;sec.classList.toggle("col",x.col);sec.querySelectorAll("[data-tog]").forEach(b=>b.textContent=x.col?"ขยายล็อตนี้":"ย่อล็อตนี้");if(x.col)sec.scrollIntoView({behavior:"smooth",block:"nearest"});save()}
 else if(D.del!==undefined){const i=+D.del;ask("ลบล็อตที่ "+(i+1)+" ใช่หรือไม่? ข้อมูลในล็อตนี้จะหายทั้งหมด",()=>{d.batches.splice(i,1);save();render()})}
 else if(D.now){const B=d.batches[D.b],j=+D.s,[a,b]=nowParts();const put=(jj,k,v)=>{B.st[jj][k]=v;const el=document.querySelector(`[data-b="${D.b}"][data-s="${jj}"][data-k="${k}"]`);if(el)el.value=v};if(D.now=="s"){put(j,"sd",a);put(j,"st",b)}else{put(j,"ed",a);put(j,"et",b);if(j<7&&!B.st[j+1].sd){put(j+1,"sd",a);put(j+1,"st",b)}}save();calc()}
 else if(D.go){cur=D.go;tab=1;render();scrollTo(0,0)}
 else if(t.id=="csv")exportCsv();
 else if(t.id=="sign"){
  if(d.signed){d.signed=false;save();render();return}
  const m=[];
  if(!d.batches.length)m.push("ยังไม่มีล็อตที่บันทึก");
  if(!d.rec.trim()||!d.rev.trim())m.push("ต้องกรอกชื่อผู้บันทึกและผู้ตรวจสอบ");
  if(!d.type)m.push("ยังไม่ได้เลือกชนิดกระจก");
  const un=d.batches.filter(x=>!balance(x)).length;if(un)m.push("มี "+un+" ล็อตที่ยังกรอกน้ำหนักไม่ครบสำหรับตรวจสมดุล");
  const fl=d.batches.filter(x=>balance(x)?.bad&&!x.chk).length;if(fl)m.push("มี "+fl+" ล็อตที่น้ำหนักไม่ตรง ให้ตรวจซ้ำและติ๊ก “ตรวจซ้ำ / แก้ไขแล้ว”");
  if(m.length){$("msg").innerHTML='<div class="msg" role="alert">'+m.join("<br>")+"</div>";return}
  d.signed=true;save();render();
 }
});
render();
</script>
